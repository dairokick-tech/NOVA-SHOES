name: Build and deploy NOVA SHOES

on:
  push:
    branches: [nova-shoes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOVA SHOES
        uses: actions/checkout@v4
        with:
          ref: nova-shoes
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build and validate NOVA SHOES
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://nova-shoes-api.onrender.com' }}
        run: npm run build
      - name: Check backend JavaScript syntax
        run: node --check server/index.js && node --check server/migrate.js
      - name: Enable SPA deep links for /admin
        run: cp dist/index.html dist/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

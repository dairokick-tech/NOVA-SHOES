name: Publish NOVA SHOES to GitHub Pages

on:
  workflow_run:
    workflows: ["Build NOVA SHOES"]
    types: [completed]
    branches: [nova-shoes]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated NOVA SHOES build
        uses: actions/download-artifact@v4
        with:
          name: nova-shoes-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish NOVA SHOES
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish NOVA SHOES with connected API defaults to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOVA SHOES source
        uses: actions/checkout@v4
        with:
          ref: nova-shoes
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build NOVA SHOES
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://nova-shoes-api.onrender.com' }}
        run: npm run build
      - name: Check backend JavaScript syntax
        run: node --check server/index.js && node --check server/migrate.js
      - name: Enable SPA deep links for /admin
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload NOVA SHOES website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish NOVA SHOES
        id: deployment
        uses: actions/deploy-pages@v4

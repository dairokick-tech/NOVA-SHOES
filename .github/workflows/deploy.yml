name: Build NOVA SHOES

on:
  push:
    branches: [nova-shoes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-shoes-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOVA SHOES
        uses: actions/checkout@v4
        with:
          ref: nova-shoes
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build and validate NOVA SHOES
        run: npm run build
      - name: Save website artifact for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: nova-shoes-dist
          path: dist
          if-no-files-found: error
          retention-days: 2

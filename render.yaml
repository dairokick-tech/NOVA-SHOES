services:
  - type: web
    name: nova-shoes-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://dairokick-tech.github.io
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
